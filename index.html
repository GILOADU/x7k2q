<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OET | Pharmacy – Practice Test</title>
<style>
:root{--b:#00539f;--bd:#003b73;--l:#e6eef7;--r:#c0392b;--g:#1e8449;--amber:#e8a13a;--fs:15px}
*{box-sizing:border-box}
body{margin:0;font:var(--fs)/1.55 Arial,Helvetica,sans-serif;color:#222;background:#f3f5f8}
header{background:var(--b);color:#fff;display:flex;gap:12px;justify-content:space-between;align-items:center;padding:8px 16px;position:sticky;top:0;z-index:5;flex-wrap:wrap}
header b{font-size:17px;letter-spacing:.3px}
.cand{opacity:.85;font-size:13px}
#secLabel{font-weight:700}
#clock{font:700 15px monospace;background:var(--bd);padding:4px 12px;border-radius:3px;min-width:175px;text-align:center}
#clock.warn{background:#b7791f}
#clock.crit{background:#a11;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.45}}
.zb{background:var(--bd);color:#fff;border:1px solid #002a53;border-radius:3px;padding:4px 9px;cursor:pointer;font:inherit}
nav{background:#fff;border-bottom:2px solid var(--b);display:flex;flex-wrap:wrap}
nav button{border:0;background:none;padding:12px 22px;font:inherit;cursor:pointer;color:#333}
nav button.on{background:var(--b);color:#fff}
main{max-width:1180px;margin:20px auto;padding:0 16px}
.rail{max-width:1180px;margin:16px auto 0;padding:0 16px;display:flex;align-items:center;gap:8px}
.rstep{display:flex;align-items:center;gap:8px}
.dot{width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid #b9c4d2;color:#68737f;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.rstep.on .dot{background:var(--b);border-color:var(--b);color:#fff}
.rstep.done .dot{background:var(--g);border-color:var(--g);color:#fff}
.rlab{font-size:12.5px;color:#5b6672;white-space:nowrap}
.rstep.on .rlab{color:var(--b);font-weight:700}
.rline{flex:1;height:2px;background:#cdd6e0;min-width:12px}
.rline.done{background:var(--g)}
@media(max-width:700px){.rlab{display:none}}
.card{background:#fff;border:1px solid #cfd6df;border-radius:4px;padding:16px 20px;margin-bottom:14px}
h2{margin:0 0 6px;color:var(--b)}h3{margin:18px 0 8px}
table{border-collapse:collapse;width:100%}td,th{border:1px solid #cfd6df;padding:7px 10px;text-align:left;vertical-align:top}th{background:var(--l)}
input[type=text]{border:1px solid #888;padding:6px 8px;width:260px;max-width:100%;font:inherit}
input[type=radio]{accent-color:var(--b)}
input[type=range]{accent-color:var(--b)}
textarea{width:100%;min-height:340px;border:1px solid #888;padding:10px;font:inherit;line-height:1.5;resize:vertical}
button.p{background:var(--b);color:#fff;border:0;padding:9px 18px;cursor:pointer;font:inherit;border-radius:3px}
button.p:disabled{background:#9aa;cursor:not-allowed}
button.s{background:#fff;border:1px solid var(--b);color:var(--b);padding:8px 16px;cursor:pointer;font:inherit;border-radius:3px}
button.s:disabled{opacity:.5;cursor:not-allowed}
button.s.on{background:var(--l);font-weight:700;border-color:var(--b)}
.s.flagged{background:#fff7e6;border-color:var(--amber);color:#8a5b00;font-weight:700}
.actions{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.mut{color:#667;font-size:13px}
.ok{color:var(--g);font-weight:700}.bad{color:var(--r);font-weight:700}
.msg{padding:8px 12px;border-radius:4px;margin:10px 0;font-weight:600}
.msg.wait{background:#eef1f5;color:#5b6672}
.msg.run{background:#e8f1fb;color:var(--b)}
.msg.okm{background:#e9f7ee;color:var(--g);border:1px solid #bfe5cd}
.msg.bad{background:#fdecea;color:var(--r)}
.cam{position:relative;background:#101820;border-radius:6px;height:230px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.camtxt{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#9fb3c8;font:600 11px monospace;letter-spacing:1px;z-index:4}
.scanline{position:absolute;left:0;right:0;top:0;height:2px;background:rgba(0,180,255,.9);box-shadow:0 0 14px 3px rgba(0,180,255,.65);opacity:0;z-index:3}
.scanline.run{opacity:1;animation:scan 1.5s linear infinite}
@keyframes scan{0%{top:0}100%{top:calc(100% - 2px)}}
.camvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.silh{width:84px;height:84px;opacity:.45;z-index:1}
.corners i{position:absolute;width:26px;height:26px;border:3px solid rgba(120,200,255,.75);z-index:2}
.corners i:nth-child(1){top:12px;left:12px;border-right:0;border-bottom:0}
.corners i:nth-child(2){top:12px;right:12px;border-left:0;border-bottom:0}
.corners i:nth-child(3){bottom:12px;left:12px;border-right:0;border-top:0}
.corners i:nth-child(4){bottom:12px;right:12px;border-left:0;border-top:0}
.cam.ok{box-shadow:inset 0 0 0 3px var(--g)}
.chip{display:inline-flex;width:36px;height:36px;border-radius:50%;border:2px solid #b9c4d2;color:#8a97a5;align-items:center;justify-content:center;font-weight:700;margin-right:8px;transition:.15s}
.chip.on{background:var(--b);border-color:var(--b);color:#fff;box-shadow:0 0 0 4px #cfe2f4}
.player{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.ptrack{flex:1;min-width:110px;height:8px;background:#dde4ec;border-radius:4px;overflow:hidden}
.pfill{height:100%;width:0;background:var(--b)}
.tuttag{display:inline-block;background:var(--l);color:var(--b);font-weight:700;padding:4px 12px;border-radius:14px;margin-bottom:10px;font-size:13px}
.tuthead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.mock{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.mock>div{border:1px dashed #9fb3c8;background:#f8fafc;padding:12px;border-radius:4px}
@media(max-width:700px){.mock{grid-template-columns:1fr}}
.demoopt{display:block;padding:7px 10px;border:1px solid #d4dbe3;border-radius:4px;margin:5px 0;cursor:pointer;user-select:none}
.demoopt:hover{background:#f0f4fa}
.demoopt.strike{text-decoration:line-through;opacity:.45}
.revgrid{display:grid;grid-template-columns:repeat(auto-fill,36px);gap:6px;max-height:300px;overflow:auto;margin:10px 0}
.pv{width:34px;height:34px;border:1px solid #99a;background:#fff;cursor:pointer;font:inherit;border-radius:3px;padding:0}
.pv.ans{background:var(--g);border-color:var(--g);color:#fff}
.pv.fl{outline:3px solid var(--amber);outline-offset:-3px}
.legend span{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin:0 4px 0 12px;border:1px solid #99a;border-radius:2px}
.sw{display:inline-block;width:13px;height:13px;border:1px solid #99a;border-radius:2px;vertical-align:-2px}
.sw.g{background:var(--g);border-color:var(--g)}
.sw.fo{background:#fff;outline:2px solid var(--amber);outline-offset:-2px}
.sw.w{background:#fff}
mark.hl{background:#ffe98a;color:inherit;padding:0 1px}
.tx{white-space:pre-wrap;background:#fafafa;border:1px solid #ddd;padding:12px;margin:8px 0;border-radius:4px}
.txpane{max-height:calc(100vh - 260px);min-height:200px;overflow-y:auto;overflow-x:hidden}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.env{list-style:none;padding:0;margin:6px 0}.env li{margin:5px 0;color:#2c3e50}
.center{text-align:center;padding:26px 10px}
.bigok{width:66px;height:66px;border-radius:50%;background:var(--g);color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.sum{max-width:460px;margin:14px auto}
.startrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.bigbtn{font-size:16px;padding:12px 26px}
dialog{border:1px solid #999;border-radius:6px;padding:20px;width:440px;max-width:92vw}
dialog::backdrop{background:rgba(20,30,45,.55)}
#toasts{position:fixed;bottom:18px;right:18px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{background:#333;color:#fff;padding:10px 16px;border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.3);max-width:340px}
.big{font-size:20px}
.rok td{background:#f2faf5}.rbad td{background:#fdf3f2}
details{margin:10px 0}summary{cursor:pointer;font-weight:700;color:var(--b)}
/* exam engine */
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:860px){.split{grid-template-columns:1fr}}
.bar{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid #cfd6df;padding:10px 14px;margin-top:14px;position:sticky;bottom:0;box-shadow:0 -2px 8px rgba(0,0,0,.07);flex-wrap:wrap;z-index:4}
.opt{display:block;padding:6px 8px;border:1px solid transparent;border-radius:4px;cursor:pointer;margin:2px 0}.opt:hover{background:#f0f4fa}
.opt.strike{text-decoration:line-through;opacity:.45}
.q{margin:12px 0;padding-left:34px;position:relative}.q .n{position:absolute;left:0;top:0;background:var(--b);color:#fff;border-radius:50%;width:26px;height:26px;text-align:center;font-size:13px;line-height:26px}
.q .flagbtn{position:absolute;left:1px;top:29px}
.flagbtn{border:0;background:none;cursor:pointer;font-size:15px;color:#a6adba;padding:0 4px}.flagbtn.on{color:var(--amber)}
.notes{border:2px solid #556;background:#fff;padding:10px 18px 14px;margin:12px 0}.nt{font-style:italic;color:#445;margin-bottom:6px}
.nh{font-weight:700;color:var(--b);border-bottom:1px solid #cfd6df;margin:14px 0 4px;padding-bottom:2px;text-transform:uppercase;font-size:13px;letter-spacing:.5px}
.nl{margin:6px 0 6px 14px;line-height:2.2}.nl:before{content:"\2022 ";color:#667}.nl.lv1{margin-left:42px}.nl.lv1:before{content:"\25E6 "}
.gap{display:inline-flex;align-items:center;gap:5px;margin:0 4px;vertical-align:middle}
.gn{background:var(--b);color:#fff;border:0;border-radius:50%;min-width:24px;height:24px;font-size:12px;line-height:24px;text-align:center;cursor:pointer;padding:0}
.gn.flg{background:var(--amber)}
.gap input{width:170px;padding:3px 6px;border:0;border-bottom:2px solid #556;background:#f7f9fc}
/* demo engine */
.dsplit{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:760px){.dsplit{grid-template-columns:1fr}}
.dopt{display:block;padding:7px 10px;border:1px solid #d4dbe3;border-radius:4px;margin:5px 0;cursor:pointer;user-select:none}
.dopt:hover{background:#f0f4fa}
.dopt.strike{text-decoration:line-through;opacity:.45}
.dbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.foot{max-width:1180px;margin:6px auto 24px;padding:0 16px;color:#8a97a5;font-size:12px;text-align:center}
nav button.lock{color:#8a97a5;cursor:not-allowed}
nav button.lock.on{background:#8a97a5;color:#fff}
#scoreChip{font-weight:700}
.sbt td:nth-child(2),.sbt td:nth-child(3){white-space:nowrap}
.sbt th{font-size:14px}
</style>
</head>
<body>
<header>
  <b id="obTitle">OET | Pharmacy</b>
  <span class="cand" id="candLbl"></span>
  <span id="secLabel"></span>
  <span style="flex:1"></span>
  <span id="gUser" style="display:none;align-items:center;gap:6px"><img id="gPic" alt="" referrerpolicy="no-referrer" style="width:22px;height:22px;border-radius:50%"><span id="gName" style="font-size:12px"></span><button class="zb" onclick="gSignOut()" title="Sign out">Sign out</button></span>
  <span id="gBtn" title="Sign in with Google"></span>
  <button class="zb" onclick="zoom(-1)" title="Zoom out">A−</button>
  <button class="zb" onclick="zoom(1)" title="Zoom in">A+</button>
  <button class="zb" id="scoreChip" onclick="openScores()" title="Open score tracker">🏆 Score: —</button>
  <span id="clock" aria-live="polite">--:--</span>
  <button class="zb" onclick="openSet()" title="Settings / API key">⚙</button>
</header>

<div class="rail" id="rail"></div>
<nav id="nav"></nav>
<main id="main"></main>
<p class="foot">Training simulation of the computer-delivered OET · not affiliated with the OET Centre / CBLA.</p>

<dialog id="obSet">
  <h3 style="margin-top:0">Settings &amp; utilities</h3>
  <label>Profession (header title)</label><br>
  <select id="prof" onchange="obSetProf(this.value)" style="width:100%;padding:6px;margin:6px 0 12px">
    <option>Pharmacy</option><option>Nursing</option><option>Medicine</option><option>Dentistry</option><option>Physiotherapy</option>
  </select>
  <label>Gemini API key <span class="mut">(needed for AI-generated sub-tests)</span></label>
  <div style="display:flex;gap:8px;margin:6px 0">
    <input type="password" id="obKey" placeholder="AIzaSy…" style="flex:1;padding:6px;font:inherit" oninput="obKeyStatus()">
    <button class="s" onclick="obToggleKey()" title="Show / hide">👁</button>
  </div>
  <div class="mut" id="obKeyStatus"></div>
  <div style="display:flex;gap:8px;margin:8px 0 14px">
    <button class="p" onclick="obSaveKey()">Save key</button>
    <button class="s" onclick="obTestKey()">Test key</button>
  </div>
  <label>Gemini model</label><br>
  <select id="obModel" onchange="obSetModel(this.value)" style="width:100%;padding:6px;margin:6px 0 12px">
    <option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
    <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash Lite</option>
  </select>
  <label>Default volume</label>
  <input type="range" min="0" max="1" step="0.05" id="setVolR" oninput="setVol(this.value)" style="width:100%">
  <p style="text-align:right;margin:14px 0 0">
    <button class="s" onclick="restartOb()">Restart check-in</button>
    <button class="p" onclick="$('obSet').close()">Close</button>
  </p>
</dialog>

<dialog id="cf"><h3 id="cfT"></h3><p id="cfM"></p>
<p style="text-align:right;margin:0"><button class="s" onclick="$('cf').close()">Cancel</button> <button class="p" id="cfY" onclick="cfGo()">Confirm</button></p></dialog>

<dialog id="rev"><h3>Review questions</h3><div class="revgrid" id="revGrid"></div>
<div class="legend mut">Answered<span style="background:var(--g)"></span> Flagged<span style="background:#fff;outline:2px solid var(--amber);outline-offset:-2px"></span> Unanswered<span style="background:#fff"></span></div>
<p class="mut" id="revSum"></p><p style="text-align:right;margin:0"><button class="s" onclick="$('rev').close()">Return to questions</button> <button class="p" onclick="askSubmit()">Submit part</button></p></dialog>

<dialog id="sb" style="width:720px"><h3 style="margin-top:0">🏆 Score tracker</h3>
<div id="sbBody" style="max-height:62vh;overflow:auto"></div>
<p style="text-align:right;margin:12px 0 0"><button class="s" onclick="$('sb').close()">Close</button></p></dialog>

<div id="toasts"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* ==================== shared helpers ==================== */
const $=id=>document.getElementById(id),
      esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m,ms=4000){const t=document.createElement('div');t.className='toast';t.textContent=m;$('toasts').appendChild(t);setTimeout(()=>t.remove(),ms)}
let key=localStorage.getItem('gk')||'',
    currentModel=localStorage.getItem('gmodel')||'gemini-3.8-flash',
    tick,DATA={},played={},chat=[],RP=null,cards=[],EX=null,hlon=false,pendingNav=null,
    busyW=false,busyS=false,lastLeftFor=-1,cfY=null,ac,MG,cur,progRAF;
let CAND=localStorage.getItem('cand')||'Dr. Alex Mercer';
 $('candLbl').textContent='Candidate: '+CAND;
let fs=+(localStorage.getItem('fs')||15);
document.documentElement.style.setProperty('--fs',fs+'px');
function zoom(d){fs=Math.min(22,Math.max(12,fs+d));localStorage.setItem('fs',fs);document.documentElement.style.setProperty('--fs',fs+'px')}
const VOL=()=>+(localStorage.getItem('ovol')??0.8);
function setVol(v){localStorage.setItem('ovol',v);if(MG)MG.gain.value=+v;if(OB.gain)OB.gain.gain.value=+v}
const obWait=ms=>new Promise(r=>setTimeout(r,ms));

/* ==================== onboarding state & wizard ==================== */
const OB={step:1,checks:{cred:false,id:false,login:false,details:false,audio:false,tut:false},times:{},page:1,left:600,tick:null,pvT:null,scan:false,tone:false,ac:null,gain:null,raf:null,clock:'local',demo:null};
function localClock(){const d=new Date();$('clock').textContent=d.toTimeString().slice(0,5)+' · Local'}
setInterval(()=>{if(OB.clock==='local')localClock()},1000);

const RAIL=[['1','Credentials'],['2','Check-in'],['3','Login'],['4','Verify details'],['5','Tutorial'],['6','Start exam']];
const LAST=RAIL.length;
function drawRail(){$('rail').innerHTML=RAIL.map(([n,l],i)=>`<div class="rstep ${i+1<OB.step?'done':i+1===OB.step?'on':''}"><div class="dot">${i+1<OB.step?'✓':n}</div><div class="rlab">${l}</div></div>${i<RAIL.length-1?`<div class="rline ${i+1<OB.step?'done':''}"></div>`:''}`).join('')}
function goStep(n){clearInterval(OB.tick);OB.demo=null;OB.step=n;drawRail();
  const dr=$('dRev');if(dr)dr.close();
  if($('rail'))$('rail').style.display='';
  $('secLabel').textContent=['','Step 1 · Credentials Required','Step 2 · Check-in & Verification','Step 3 · Login Screen','Step 4 · Verification & Instructions','Step 5 · Tutorial','Step 6 · Start Exam'][n];
  [null,step1,step2,step3,step4,step5,step6][n]();
  window.scrollTo({top:0,behavior:'smooth'})}
function restartOb(){Object.keys(OB.checks).forEach(k=>OB.checks[k]=false);OB.times={};goStep(1)}

/* ---------- STEP 1 : credentials required ---------- */
function step1(){
  OB.clock='local';const c=$('clock');c.classList.remove('warn','crit');localClock();
  $('main').innerHTML=`<div class="card">
  <h2>Credentials Required at the Computer</h2>
  <p>When sitting at the test station, you will be prompted to log in or launch your exam using:</p>
  <table>
   <tr><th style="width:30%">Credential</th><th>What it is</th></tr>
   <tr><td><b>Prometric Confirmation Number</b></td><td>This is the <b>16-digit</b> unique booking confirmation number sent to your email when you scheduled your test.</td></tr>
   <tr><td><b>Last Name / Surname</b></td><td>Must be typed exactly as it appears on your passport or official identification document.</td></tr>
   <tr><td><b>Candidate ID / OET Number</b> <span class="mut">(if prompted)</span></td><td>Your <b>8-digit</b> OET Candidate Number (typically starting with <b>471…</b>) found in your official OET profile.</td></tr>
  </table>
  <div class="actions"><span style="flex:1"></span>
   <button class="p" onclick="OB.checks.cred=true;goStep(2)">Continue to check-in →</button></div>
  </div>`}

/* ---------- STEP 2 : check-in & verifications ---------- */
function step2(){const done=OB.checks.id;
  OB.clock='local';
  $('main').innerHTML=`<div class="card">
  <h2>What Happens at the Computer Screen</h2>
  <h3 style="margin-top:6px">1. Check-In &amp; Verifications</h3>
  <p class="mut">Before you start typing on the computer, an invigilator/proctor verifies your physical identity document, takes your photo, and assigns you to a workstation.</p>
  <div class="two">
   <div>
    <ul class="env">
     <li>${done?'✓':'○'} Physical identity document checked by the invigilator</li>
     <li>${done?'✓':'○'} Photo taken</li>
     <li>${done?'✓':'○'} Workstation assigned</li>
    </ul>
    <div class="msg ${done?'okm':'wait'}" id="idStatus">${done?'✓ Photo taken & ID verified — workstation assigned':'● Check-in not yet completed'}</div>
    <button class="p" id="btnScan" onclick="runScan()" ${done?'disabled':''}>${done?'✓ Check-in complete':'▶ Start check-in (ID check & photo)'}</button>
   </div>
   <div>
    <div class="cam ${done?'ok':''}" id="cam">
      <div class="corners"><i></i><i></i><i></i><i></i></div>
      <div class="scanline ${done?'':'run'}" id="scanline"></div>
      <svg class="silh" viewBox="0 0 24 24" fill="#5a6b7d"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-5 0-9 2.5-9 6v2h18v-2c0-3.5-4-6-9-6Z"/></svg>
      <div class="camtxt" id="camtxt">${done?'✓ PHOTO TAKEN':'CAMERA PREVIEW — SIMULATION'}</div>
    </div>
    <p class="mut">Simulation mode: if you grant camera access it is shown locally only — nothing is stored or transmitted.</p>
   </div>
  </div>
  <div class="actions"><button class="s" onclick="goStep(1)">← Back</button><span style="flex:1"></span>
   <button class="p" id="go3" onclick="goStep(3)" ${done?'':'disabled'}>Proceed to Login Screen →</button></div>
  </div>`}
async function runScan(){if(OB.scan)return;OB.scan=true;
  const cam=$('cam'),line=$('scanline'),txt=$('camtxt'),st=$('idStatus'),b=$('btnScan');
  b.disabled=true;st.className='msg run';st.textContent='● Check-in in progress…';line.classList.add('run');
  let stream=null;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{width:320,height:240}});
    const v=document.createElement('video');v.autoplay=true;v.muted=true;v.playsInline=true;v.srcObject=stream;v.className='camvid';cam.prepend(v)}catch(e){}
  txt.textContent='CHECKING IDENTITY DOCUMENT…';await obWait(1500);
  txt.textContent='TAKING PHOTO…';await obWait(1500);

async function playTone(){if(OB.tone)return;OB.tone=true;
  const b=$('toneBtn');b.disabled=true;
  $('audStatus').className='msg run';$('audStatus').textContent='● Playing test tone… listen in both ears';
  try{

function obTone(pan,chipId){return new Promise(res=>{
  const o=OB.ac.createOscillator();o.type='sine';o.frequency.value=440;
  const g=OB.ac.createGain();const chip=$(chipId);chip.classList.add('on');
  const t=OB.ac.currentTime;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+.08);g.gain.setValueAtTime(.5,t+1);g.gain.linearRampToValueAtTime(0,t+1.2);
  o.connect(g);
  if(OB.ac.createStereoPanner){const p=OB.ac.createStereoPanner();p.pan.value=pan;g.connect(p);p.connect(OB.gain)}else g.connect(OB.gain);
  o.start(t);o.stop(t+1.25);
  setTimeout(()=>{chip.classList.remove('on');res()},1400)})}

function secDone(s){
 if(s==='L')return ORDER.L.every(k=>isDone('L',k));
 if(s==='R')return isDone('R','A')&&isDone('R','B')&&(isDone('R','C')||crem()<=0);
 if(s==='W')return isDone('W','T');

 return false}

 if(secLocked(sk))return 'seclocked';
 const i=ORDER[sk].indexOf(pk);
 if(i>0&&!isDone(sk,ORDER[sk][i-1]))return 'locked';

function scaled(raw42){return Math.round(raw42<=30?raw42/30*350:350+(raw42-30)/12*150)}   /* approx: 30/42 = 350 */
function grade(s){return s>=450?'A':s>=350?'B':s>=300?'C+':s>=200?'C':s>=100?'D':'E'}

/* Listening Part A: normalise gaps/answers, then validate against the transcript */
function normLA(d){
 const probs=[];let usable=true;
 const items=Array.isArray(d&&d.items)?d.items:[];
 if(items.length<2)return{ok:false,usable:false,probs:['Fewer than 2 extracts returned']};
 items.length=2;
 const clean=x=>String(x||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
 const GAP=/_{3,}|\[\s*\d+\s*\]|\(\s*\d+\s*\)|…+|\.{4,}/g;
 items.forEach((it,n)=>{
  const tag='Extract '+(n+1)+': ';
  const dlg=(Array.isArray(it.dialogue)?it.dialogue:[]).filter(l=>l&&l.t).map(l=>({s:String(l.s||'Speaker'),t:String(l.t)}));
  it.dialogue=dlg;
  const tx=clean(dlg.map(l=>l.t).join(' ')),words=tx?tx.split(' ').length:0;
  const legacy=Array.isArray(it.answers)?it.answers.map(String):[];
  const out=[],ans=[],snips=[],vars_=[];
  (Array.isArray(it.notes)?it.notes:[]).forEach(l=>{
   if(typeof l==='string')l={t:l};
   if(!l)return;
   if(l.h&&!l.t){out.push({h:String(l.h)});return}
   let t=String(l.t||l.text||'').replace(GAP,'____');
   let a=l.a!=null?l.a:(l.answer!=null?l.answer:l.answers);
   a=a==null?[]:Array.isArray(a)?a.map(String):[String(a)];
   const g=(t.match(/____/g)||[]).length;
   const vs=Array.isArray(l.v)?l.v.map(String):(l.v?[String(l.v)]:[]);
   const xs=Array.isArray(l.x)?l.x.map(String):(l.x!=null?[String(l.x)]:[]);
   for(let j=0;j<g;j++){ans.push(String(a[j]!=null?a[j]:(legacy.length?legacy.shift():'')).trim());snips.push(xs[j]||'');vars_.push(vs[j]||'')}
   out.push({t,lv:l.lv?1:0})});
  it.notes=out;it.answers=ans;it.snips=snips;it.vars=vars_;
  if(!ans.length){usable=false;probs.push(tag+'no gaps in the notes')}
  if(ans.some(x=>!x)){usable=false;probs.push(tag+'a gap has no answer')}
  if(ans.length&&ans.length!==12)probs.push(tag+ans.length+' gaps instead of 12');
  let pos=0;
  ans.forEach((x,j)=>{const c=clean(x);if(!c)return;
   if(c.split(' ').length>3)probs.push(tag+'gap '+(j+1)+' answer is longer than 3 words');
   const i=tx.indexOf(c,pos);
   if(i<0)probs.push(tag+'gap '+(j+1)+(tx.indexOf(c)<0?' answer is not in the recording':' is out of order'));
   else pos=i+c.length});
  if(words<570||words>790)probs.push(tag+'recording is '+words+' words (needs about 600-750 for 4-5 minutes)');
 });
 return{ok:!probs.length,usable,probs}}

 if(sk==='R'&&pk==='B'&&rem==null){ask('Part B & C – combined timing','In the real OET, Reading Parts B and C share ONE 45-minute timer. Part B starts now; when you submit Part B the remaining time carries over to Part C, and you cannot return to Part B.',()=>startPart('R','B',SPEC.R.parts.B.min*60),'Start Part B');return}
 const P=SPEC[sk].parts[pk],id=sk+pk;mmss();stopAudio();$('secLabel').textContent=P.t;

 try{let d;
  if(id==='LA'){let best=null,lastErr=null;
   for(let t=1;t<=3;t++){
    if(t>1)$('main').innerHTML='<div class="card">Preparing '+esc(P.t)+'… <span class="mut">(checking the notes against the recording — attempt '+t+' of 3)</span></div>';
    let cand;try{cand=await gem(P.p)}catch(e){lastErr=e;continue}

    if(v.ok)break}
   if(!best)throw lastErr||new Error('No valid Part A set was produced (no gaps appeared). Please start Part A again.');
   if(!best.v.ok)console.warn('Part A quality notes:',best.v.probs);

function normPassage(it){

 let t=flat(it.text)||flat(it.texts)||it.body||it.passage||it.content||it.memo||it.email||it.notice||it.extract||it.article||it.excerpt||'';
 if(!t&&Array.isArray(it.dialogue))t=it.dialogue.map(d=>(d.s?d.s+': ':'')+(d.t||'')).join('\n');

function masterGain(){MG=MG||ac.createGain();MG.gain.value=VOL();MG.connect(ac.destination);return MG}

const TTS_MODELS=['gemini-3.1-flash-tts-preview','gemini-2.5-flash-preview-tts'];
async function ttsFetch(text,two,v1='Kore',v2='Charon'){

 let st;try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){MIC.ok=false;msg.className='msg bad';
  msg.textContent=(e.name==='NotAllowedError'||e.name==='SecurityError')?'✗ Microphone access is blocked. Click the lock icon in the address bar, allow the microphone, then test again.'
   :(e.name==='NotFoundError'||e.name==='OverconstrainedError')?'✗ No microphone found. Plug one in and test again.'
   :e.name==='NotReadableError'?'✗ The microphone is in use by another app. Close that app and test again.'
   :'✗ Could not start the microphone: '+e.message;return}

 const AC=window.AudioContext||window.webkitAudioContext;const ctx=new AC();MIC.ctx=ctx;
 const an=ctx.createAnalyser();an.fftSize=512;ctx.createMediaStreamSource(st).connect(an);
 const buf=new Uint8Array(an.fftSize);let peak=0;const t0=performance.now();
 msg.className='msg run';msg.textContent='● Microphone detected: '+label+' — say a few words…';

 const ling=clamp(e.intelligibility,6)+clamp(e.fluency,6)+clamp(e.appropriateness,6)+clamp(e.grammar,6),clin=clamp(e.relationship,3)+clamp(e.perspective,3)+clamp(e.structure,3)+clamp(e.gathering,3)+clamp(e.giving,3),ss=ling+clin;
 lockPart('S',RP,{score:ss,max:SMAX,ling,clin});
 $('sf').innerHTML=`<div class="card"><h2>Role-play ${RP+1} feedback – ${fmt(ss)} / ${SMAX}</h2><p class="big">Linguistic: <b>${ling} / ${LMAX}</b> · Clinical communication: <b>${clin} / ${CMAX}</b></p>${recUrl?`<p><b>Your recording</b> <span class="mut">(stored on this device only; lost when you close the page)</span></p><audio controls src="${recUrl}" style="width:100%"></audio>`:''}${runTotal()}<table><tr><th colspan="4">Linguistic criteria (each /6)</th><th colspan="5">Clinical communication indicators (each /3)</th></tr><tr><th>Intelligibility</th><th>Fluency</th><th>Appropriateness</th><th>Grammar &amp; expression</th><th>Relationship building</th><th>Patient perspective</th><th>Structure</th><th>Information gathering</th><th>Information giving</th></tr><tr><td>${e.intelligibility}</td><td>${e.fluency}</td><td>${e.appropriateness}</td><td>${e.grammar}</td><td>${e.relationship}</td><td>${e.perspective}</td><td>${e.structure}</td><td>${e.gathering}</td><td>${e.giving}</td></tr></table>
 <p><b>Strengths</b></p><ul>${(e.strengths||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p><b>To improve</b></p><ul>${(e.improvements||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p><b>Useful phrases</b></p><ul>${(e.model_phrases||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${RP==0?'<button class="p" onclick="rp(1)">Start Role-play 2</button>':'<br><button class="p" onclick="nav(\'S\')">Back to Speaking menu</button>'}</div>`}catch(x){busyS=false;$('sf').innerHTML=`<div class="card bad">${esc(x.message)}</div>`}}

/* ==================== unified settings (API key etc.) ==================== */
function openSet(){
 $('prof').value=localStorage.getItem('prof')||'Pharmacy';
 $('obModel').value=currentModel;
 $('obKey').value=key;
 obKeyStatus();$('setVolR').value=VOL();$('obSet').showModal()}
function obKeyStatus(){
 const k=($('obKey')&&$('obKey').value.trim())||'';
 const s=$('obKeyStatus');if(!s)return;
 s.innerHTML=!k?'<span class="bad">● No key saved — AI sub-tests are locked (demos still work).</span>'
  :k.startsWith('AIza')?'<span class="ok">● Key present ('+esc(k.slice(0,6))+'…'+esc(k.slice(-4))+')</span>'
  :'<span class="bad">● That doesn\'t look like a Google API key — it should start with "AIza".</span>'}
function obSaveKey(){
 const v=$('obKey').value.trim().replace(/^["']|["']$/g,'');
 key=v;localStorage.setItem('gk',v);
 obKeyStatus();obUpdateKeyBanners();
 toast(v?'API key saved':'API key cleared')}
async function obTestKey(){
 const v=$('obKey').value.trim();if(!v){toast('Paste a key first');return}
 const s=$('obKeyStatus');s.innerHTML='<span class="mut">● Testing key…</span>';
 try{
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?key='+encodeURIComponent(v));
  const d=await r.json();
  s.innerHTML=d.error?'<span class="bad">✗ Key rejected: '+esc(d.error.message)+'</span>'
   :'<span class="ok">✓ Key valid — '+(d.models||[]).length+' models available</span>';
 }catch(e){s.innerHTML='<span class="bad">✗ Network error: '+esc(e.message)+'</span>'}}
function obSetModel(m){currentModel=m;localStorage.setItem('gmodel',m)}
function obSetProf(v){localStorage.setItem('prof',v);$('obTitle').textContent='OET | '+v}
function obToggleKey(){const k=$('obKey');k.type=k.type==='password'?'text':'password'}
function obUpdateKeyBanners(){
 const has=!!(localStorage.getItem('gk')||'').trim();
 const b=document.querySelector('.obKeyBanner');
 if(!has&&OB.step===6&&$('main')&&$('main').querySelector('.card')){
  if(b)return;
  const d=document.createElement('div');d.className='msg bad obKeyBanner';
  d.innerHTML='⚠ No Gemini API key saved — the AI-generated sub-tests can\'t run (built-in Listening/Reading demos still work). '
   +'<button class="s" style="margin-left:8px" onclick="openSet()">Add key now</button>';
  $('main').querySelector('.card').prepend(d);
 }else if(b&&has){b.remove()}}
if($('main'))new MutationObserver(()=>obUpdateKeyBanners()).observe($('main'),{childList:true});

/* ==================== onboarding → engine hand-off (hardened) ==================== */
function finishOnboarding(t){
 const map={L:'Listening',R:'Reading',W:'Writing',S:'Speaking'};
 clearInterval(OB.tick);OB.demo=null;OB.clock='none';
 const c=$('clock');c.classList.remove('warn','crit');
 if($('rail'))$('rail').style.display='none';
 const dr=$('dRev');if(dr)dr.close();
 toast('Launching '+map[t]+'…');
 try{
  if(!$('nav')){const nv=document.createElement('nav');nv.id='nav';
   const m=document.querySelector('main');if(m)m.parentNode.insertBefore(nv,m)}
  nav(t);window.scrollTo({top:0,behavior:'smooth'});
 }catch(err){
  console.error('[OET onboarding] hand-off failed:',err);
  $('main').innerHTML=`<div class="card" style="border-color:var(--r)"><h3 style="margin-top:0;color:var(--r)">The ${esc(map[t])} engine could not be launched</h3>
  <p><b>Error:</b> <code>${esc(err&&err.message||String(err))}</code> <span class="mut">(full details in the browser console — F12)</span></p>
  <div class="dbar"><button class="p" onclick="obDemo('${t}')">Run built-in ${esc(map[t])} demo instead</button>
  <button class="s" onclick="goStep(6)">← Back to readiness check</button></div></div>`}}

/* ==================== init ==================== */
if(localStorage.getItem('prof'))$('obTitle').textContent='OET | '+localStorage.getItem('prof');
drawNav('home');drawRail();drawScore();goStep(1);
window.addEventListener('load',()=>{
 obUpdateKeyBanners();
 if(!(localStorage.getItem('gk')||'').trim())setTimeout(openSet,400)});

/* ==================== Google sign-in (Google Identity Services) ==================== */
const G_CLIENT_ID='399146220569-4roj67gvr1e1snc51fitjv049eoiuhh2.apps.googleusercontent.com';
function gDecode(t){try{const b=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(b))))}catch(e){return null}}
function gShow(u){
 const on=!!u;$('gUser').style.display=on?'inline-flex':'none';$('gBtn').style.display=on?'none':'inline-block';
 if(on){$('gName').textContent=u.name||u.email||'Signed in';if(u.picture)$('gPic').src=u.picture;else $('gPic').removeAttribute('src')}}
function gOnCred(r){
 const c=gDecode(r.credential);if(!c){toast('Sign-in failed – please try again.');return}
 const u={name:c.name||'',email:c.email||'',picture:c.picture||''};
 try{localStorage.setItem('guser',JSON.stringify(u))}catch(e){}
 gShow(u);toast('Signed in as '+(u.name||u.email))}
function gSignOut(){
 try{localStorage.removeItem('guser')}catch(e){}
 try{google.accounts.id.disableAutoSelect()}catch(e){}
 gShow(null);toast('Signed out')}
function gInit(){
 let saved=null;try{saved=JSON.parse(localStorage.getItem('guser')||'null')}catch(e){}
 gShow(saved);
 if(!window.google||!google.accounts||!google.accounts.id){$('gBtn').innerHTML='<button class="zb" onclick="toast(\'Google sign-in could not load – check your internet connection and open the page from http://localhost or your hosted address.\',7000)">Sign in</button>';return}
 google.accounts.id.initialize({client_id:G_CLIENT_ID,callback:gOnCred,auto_select:false});
 google.accounts.id.renderButton($('gBtn'),{theme:'outline',size:'medium',type:'standard',text:'signin_with',shape:'rectangular'});
 if(!saved)try{google.accounts.id.prompt()}catch(e){}}
window.addEventListener('load',()=>setTimeout(gInit,300));
</script>
